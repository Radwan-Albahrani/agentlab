name: Feature request
description: Something agentlab should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
  - type: dropdown
    id: who
    attributes:
      label: Who is it for
      options: [Just me on my own machine, Sharing a machine with others, Both]
