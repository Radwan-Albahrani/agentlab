# Weekly, grouped so updates arrive as a few pull requests instead of dozens.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups: { actions: { patterns: ["*"] } }

  - package-ecosystem: pip
    directories: [/gate, /companion]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups: { python: { patterns: ["*"] } }

  - package-ecosystem: bun
    directory: /hub/web
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    # majors (React, the router, TypeScript, Vite…) change code, so each comes as its own pull request instead of
    # failing the whole weekly group
    groups: { web: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # lint needs a TypeScript typescript-eslint supports (6.x); typecheck already runs 7 via the typescript7 alias.
      # Drop this once typescript-eslint supports 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: docker
    directories: [/image, /gate, /hub, /companion]
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
    groups: { images: { patterns: ["*"] } }
