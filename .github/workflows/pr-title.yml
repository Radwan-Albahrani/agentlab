# Pull requests are squash-merged, so the title becomes the commit message on main: it must be a Conventional Commit.
name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            chore
            ci
            perf
            build
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: Start the description lowercase and don't end it with a period.
