# Every part's lint and tests on each pull request and on main. scripts/check.sh runs them in pinned containers, so
# the runner only needs Docker.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [lint, cli, host, gate, companion, image, shell, hub]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: scripts/check.sh ${{ matrix.part }}

  # Base image bumps (Dependabot's docker updates) only show their breakage when the images are built.
  images:
    name: build (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [image, gate, hub, companion]
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t agentlab/${{ matrix.image }}:ci ${{ matrix.image }}
