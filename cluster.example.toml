# Every setting agentlab understands, with its default. `agentctl setup` writes a short cluster.toml for you; this
# file is the reference when you want to change something by hand (then run `agentctl apply`).
# Only the cluster's name and domain, the admins and at least one agent are required.

[cluster]
name = "example"
domain = "agents.example.com"      # everyone's own agent, chosen by who signed in (first-level: free certificate)
hub_domain = "agents-hub.example.com"   # the hub: everyone sees their own agents, admins see everything
coolify_domain = ""                # optional, e.g. "agents-coolify.example.com" (admins)
pair_domain = ""                   # optional, e.g. "{id}-t3.example.com": where the T3 desktop/mobile apps connect
timezone = "UTC"
data = "/srv/agentlab"
deploy = "compose"                 # plain Docker Compose; "coolify" if you'd like Coolify's UI for the stacks
isolation = "sysbox"               # "sysbox" (multi-person servers) or "unconfined" (WSL, one person)
publish_address = "127.0.0.1"      # where [agents.publish] / [hub] publish ports listen (one-person setups only)

[auth]
mode = "cloudflare-access"         # "cloudflare-access", "tailscale", "tinyauth" or "none" (local testing only)
ingress = ""                       # "" = the mode's default: cloudflared / tailscale / public (tinyauth) / loopback
admins = ["admin@example.com"]     # can open every agent and the hub
allow_domains = []                 # optional, e.g. ["example.com"]: anyone with an email there may sign in (Cloudflare
                                   # Access / tinyauth); only agent owners get an agent, admins only from `admins`
hub_port = 8443                    # tailscale mode: the hub's port on the machine's MagicDNS name

[auth.cloudflare]                  # mode = "cloudflare-access"
team = ""                          # your Zero Trust team (<team>.cloudflareaccess.com); setup finds it if the token
                                   # may read the Access organization, else set it here
audience = ""                      # the Access application's id for the gate; filled in by setup too
login_method = ""                  # "" = every Zero Trust login method is offered (the one-time PIN by email needs no
                                   # setup); or pin one, e.g. "One-time PIN" or "Google Workspace" (one-click)

[auth.tinyauth]                    # mode = "tinyauth"
domain = ""                        # its login page, e.g. "login.example.com"
google_client_id_file = ""         # "" = <data>/secrets/tinyauth-google-id (agentctl secret set tinyauth-google-id)
google_client_secret_file = ""     # "" = <data>/secrets/tinyauth-google-secret
# image = "ghcr.io/tinyauthapp/tinyauth:v5.1.3"   # >= 5.1.3: fixes CVE-2026-77560 and GHSA-r27r-rr9v-vv37

[defaults]                         # per-agent limits unless the agent overrides them
memory = "12g"
cpus = 4

[storage]
mode = "shared"                    # "shared": one pool for all agents; "per-person": a capped disk per owner
pool_size = ""                     # shared: "" = plain directory, or e.g. "100G" for a fixed-size pool image
pool_image = ""                    # shared with pool_size: the image file ("" = <data>/disks/pool.img)
person_size = "80G"                # per-person: each owner's disk (all their agents share it)
# person_sizes = { "sara@example.com" = "120G" }   # per-person: bigger (or smaller) disks for some owners

[limits]
total_memory = "96g"               # all agents together (agentlab.slice); leave room for the host and builds
throttle_io_psi_max = 25           # heavy jobs wait while disk pressure is above this (%)

[[agents]]
id = "admin"                       # lowercase letters, digits, dashes; becomes container and network names
owner = "admin@example.com"

[[agents]]
id = "sara"
owner = "sara@example.com"
memory = "16g"                     # optional overrides: memory, cpus, hostname, image
# color = "teal"                   # the hub's colour for this agent: green, pink, violet, amber, sky, red, teal or indigo

[[agents]]
id = "sara-mobile"                 # one person can own several agents; they pick on the menu
owner = "sara@example.com"

# One-person setups (auth.mode "tailscale" or "none", a single owner) may also publish an agent's tools on host
# ports, bypassing the edge and the gate:
# [agents.publish]
# t3 = 7101
# accounts = 7102
# browser = 7103
# terminal = 7104
# files = 7105

# [hub]
# publish = 7190                   # one-person setups only, like [agents.publish]
# extra_stacks = ["media"]         # other stacks on this host the hub should show (status, restart, logs): Compose
#                                  # project names, or Coolify project names (all of that project's services)
# bark_url = "http://host.docker.internal:7192"   # optional phone pushes through a Bark server (the hub posts here)
# bark_public = "http://my-server:7192"             # the address the phone app registers with (default: bark_url)
# extra_secrets = "/srv/other/secrets"            # another folder of secrets on this host, shown (admins only) as
# extra_secrets_map = "/srv/other/secrets-map.json" # its own group on Secrets; its map (hub/secrets-map.json format)
# extra_secrets_label = "Homelab"                  # may restart allowed containers or copy into an agent's home

[android]
enabled = true                     # Android emulator on demand (needs /dev/kvm: bare metal or nested virt)
system_image = "system-images;android-35;google_apis;x86_64"

[backups]
enabled = true                     # nightly backups of chats and companion data; `agentctl backup run` works either way
keep_days = 14
time = "03:30"

[updates]
agentlab = "off"                   # "daily": `agentctl update` every night (git pull, images, apply)
time = "04:30"
branch = "main"
agent_tools_hours = 6              # each agent refreshes T3, Claude Code, Codex... this often (0 = never)
wait_hours = 4                     # a busy agent (a T3 turn running) is waited for this long, checked every 5 min
on_busy = "defer"                  # still busy then: "defer" (next run) or "resume" (restart it, tell its chats to continue)

[cloudflare]                       # only the API token is needed (agentctl secret set cloudflare-api); its five
                                   # permissions are listed in skills/agentlab/references/access.md
account_id = ""                    # found from the token and the domain when empty
zone = ""                          # found the same way
api_token_file = ""                # "" = <data>/secrets/cloudflare-api.token

[coolify]                          # only with deploy = "coolify"
url = "http://127.0.0.1:8000"
token_file = ""                    # "" = <data>/secrets/coolify.token (agentctl secret set coolify)
project = "agentlab"

# Optional: seed a companion under an agent on the first apply (afterwards it is that agent's to change or remove).
# [[companions]]
# name = "helper"
# display_name = "Helper"           # what the bot calls itself in Slack
# agent = "admin"
# kind = "slack"

[companion_policy]                 # each agent creates and controls its own companions
self_service = true
max_per_agent = 0                  # 0 = no cap
