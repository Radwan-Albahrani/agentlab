# Slack app for the companion. Create it at https://api.slack.com/apps -> Create New App -> From a manifest.
# Rename "Companion" to the name people will tag (keep it the same as COMPANION_NAME).
display_information:
  name: Companion
  description: Your agent in Slack
  background_color: "#2f6f4f"
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Companion
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:write
      - users:read
    # The owner's read-only token: lets the companion see the owner's own DMs and threads it isn't in
    # (tags there, colleagues asking the owner in team mode). Nothing is ever written with it.
    user:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
