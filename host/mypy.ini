# Types for the host programs (janitor, watch, throttle and their shared modules): every function annotated.
# agentlab-mount-storage is a script, checked in a run of its own. Run: scripts/check.sh host
[mypy]
python_version = 3.12
files = cluster.py, safe.py, fsm.py, janitor, watch, throttle
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
