<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#101a14"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee38f"/>
      <stop offset="1" stop-color="#20a35a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2fbf6c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2fbf6c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>

  <g transform="translate(84 112)">
    <text x="0" y="56" font-size="76" font-weight="700" fill="#f0f6fc" letter-spacing="-2">agentlab</text>
    <text x="2" y="112" font-size="27" fill="#9fb3a8">AI coding agents that live on your own machine.</text>
    <text x="2" y="150" font-size="27" fill="#9fb3a8">Just you, or everyone you share it with. Always on.</text>
  </g>

  <!-- the server: one roof, private rooms -->
  <g transform="translate(780 70)">
    <rect x="0" y="0" width="330" height="220" rx="22" fill="#111c16" stroke="#2a3d31" stroke-width="2"/>
    <g font-size="15" font-weight="600">
      <rect x="22" y="24" width="134" height="76" rx="14" fill="#16261d" stroke="#2fbf6c" stroke-width="2"/>
      <circle cx="46" cy="50" r="9" fill="url(#leaf)"/>
      <text x="62" y="55" fill="#e6f4ea">work</text>
      <rect x="40" y="70" width="98" height="8" rx="4" fill="#2a3d31"/>
      <rect x="40" y="70" width="64" height="8" rx="4" fill="#2fbf6c"/>

      <rect x="174" y="24" width="134" height="76" rx="14" fill="#16261d" stroke="#2a3d31" stroke-width="2"/>
      <circle cx="198" cy="50" r="9" fill="#5b8cff"/>
      <text x="214" y="55" fill="#e6f4ea">personal</text>
      <rect x="192" y="70" width="98" height="8" rx="4" fill="#2a3d31"/>
      <rect x="192" y="70" width="30" height="8" rx="4" fill="#5b8cff"/>

      <rect x="22" y="120" width="134" height="76" rx="14" fill="#16261d" stroke="#2a3d31" stroke-width="2"/>
      <circle cx="46" cy="146" r="9" fill="#f2a83b"/>
      <text x="62" y="151" fill="#e6f4ea">sara</text>
      <rect x="40" y="166" width="98" height="8" rx="4" fill="#2a3d31"/>
      <rect x="40" y="166" width="82" height="8" rx="4" fill="#f2a83b"/>

      <rect x="174" y="120" width="134" height="76" rx="14" fill="#16261d" stroke="#2a3d31" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="241" y="164" fill="#5d7266" text-anchor="middle" font-weight="500">+ add someone</text>
    </g>
  </g>
</svg>
