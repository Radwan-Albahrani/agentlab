# Python standard for the whole repo (hub/ruff.toml extends this). Run: scripts/check.sh
target-version = "py312"
line-length = 120
extend-exclude = ["hub/web"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "RET", "PL"]
# Magic values, argument/branch counts: judged in review, not by a counter. `global` holds a daemon's module state.
ignore = ["PLR2004", "PLR0913", "PLR0911", "PLR0912", "PLR0915", "PLW0603", "E501"]

[format]
quote-style = "single"
