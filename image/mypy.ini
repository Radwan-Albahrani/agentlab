# Types for the T3 database readers (the agent-t3 venv runs Debian's Python 3.11); agent-t3 is checked on its own
# (two scripts are both __main__ to mypy). Run: scripts/check.sh image
[mypy]
python_version = 3.11
files = t3schema.py, t3state.py, agent-updater
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
