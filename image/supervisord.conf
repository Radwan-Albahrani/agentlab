; Services inside an agent container. Logs: /home/agent/logs/<name>.log
[supervisord]
nodaemon=true
logfile=/home/agent/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/home/agent/logs

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Agent work runs at nice 10 (inherited by builds/tests/browsers) so it can't starve the Accounts page.
[program:t3]
command=nice -n 10 bash -lc 'exec t3 serve --host 0.0.0.0 --port 3773'
directory=/workspace
autorestart=true
stdout_logfile=/home/agent/logs/t3.log
redirect_stderr=true

; Web terminal (port 7681), served by the edge under /_agentlab/terminal (the prefix is kept, so ttyd knows it).
[program:terminal]
command=nice -n 10 /usr/local/bin/ttyd --writable --url-arg --port 7681 --base-path /_agentlab/terminal -t fontSize=15 -t titleFixed=agent-terminal /usr/local/bin/agent-terminal
directory=/workspace
autorestart=true
stdout_logfile=/home/agent/logs/terminal.log
redirect_stderr=true

[program:herdr]
command=nice -n 10 bash -lc 'exec herdr server'
directory=/workspace
autorestart=true
stdout_logfile=/home/agent/logs/herdr.log
redirect_stderr=true

; The agent's Docker engine, started/stopped on demand by docker-proxy (docker-on-demand).
[program:dockerd]
command=nice -n 10 /usr/local/bin/agent-dockerd
environment=XDG_RUNTIME_DIR="/run/user/1000",HOME="/home/agent"
autostart=false
autorestart=unexpected
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/home/agent/logs/dockerd.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:docker-proxy]
command=/usr/local/bin/docker-on-demand
autorestart=true
priority=5
stdout_logfile=/home/agent/logs/docker-proxy.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

; Browser display, on demand: chrome-on-demand starts it, browser-idle-reaper stops it. Watch via noVNC (6080).
[program:xvfb]
command=Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac
autostart=false
autorestart=unexpected
priority=10
stdout_logfile=/home/agent/logs/xvfb.log
redirect_stderr=true

[program:vnc]
command=x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet
autostart=false
autorestart=unexpected
priority=20
stdout_logfile=/home/agent/logs/vnc.log
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autostart=false
autorestart=unexpected
priority=30
stdout_logfile=/home/agent/logs/novnc.log
redirect_stderr=true

; Android emulator, on demand: `android-emulator start` starts it, android-reaper stops it when adb goes quiet.
[program:android]
command=/usr/local/bin/android-emulator run
autostart=false
autorestart=unexpected
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/home/agent/logs/android.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:android-reaper]
command=/usr/local/bin/android-emulator reap
autorestart=true
stdout_logfile=/home/agent/logs/android-reaper.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

; Keeps T3, Claude Code, Codex and the other CLIs current; restarts only t3, and only while idle (agent-updater).
[program:updater]
command=nice -n 15 /usr/local/bin/agent-updater
autorestart=true
stdout_logfile=/home/agent/logs/updater.log
stdout_logfile_maxbytes=2MB
redirect_stderr=true

[program:janitor]
command=/usr/local/bin/agent-janitor
autorestart=true
stdout_logfile=/home/agent/logs/janitor.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true

; Throttle shims for exactly the heavy tools installed (see /usr/local/lib/agent-throttle).
[program:shim-sync]
command=/usr/local/lib/agent-throttle/shim-sync
autorestart=true
priority=1
stdout_logfile=/home/agent/logs/shim-sync.log
stdout_logfile_maxbytes=1MB
redirect_stderr=true

[program:browser-reaper]
command=/usr/local/bin/browser-idle-reaper
autorestart=true
stdout_logfile=/home/agent/logs/browser-reaper.log
redirect_stderr=true

; Accounts page (sign-ins, connectors, companion bridge), port 8790.
[program:accounts]
command=python3 /opt/accounts/app.py
autorestart=true
stdout_logfile=/home/agent/logs/accounts.log
redirect_stderr=true

; Cyrus (Linear agent): off until the owner configures a Linear app for it.
[program:cyrus]
command=bash -lc 'exec cyrus'
directory=/home/agent
autostart=false
autorestart=true
stdout_logfile=/home/agent/logs/cyrus.log
redirect_stderr=true
